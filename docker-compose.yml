services:
  postgres:
    image: postgres:16-alpine
    container_name: frigus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: frigus
      POSTGRES_PASSWORD: frigus
      POSTGRES_DB: frigus
    ports:
      - "5432:5432"
    volumes:
      - frigus_postgres_data:/var/lib/postgresql/data
      - ./data/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frigus -d frigus"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: frigus_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - frigus_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frigus_postgres_data:
  frigus_mongo_data:
